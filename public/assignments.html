<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <title>Assignments | Study Planner</title>
</head>
<body>

    <nav>
        <a href="register.html">Register</a> |
        <a href="login.html">Login</a> |
        <a href="assignments.html">Assignments</a>
    </nav>

    <h1>Create Assignment</h1>

    <img src="images/student_studying.jpg" 
        alt="Student studying"
        class="planner-image">

    <form id="assignmentForm">

    <label>Assignment:</label><br>
        <input type="text" id="assignment" name="assignment"><br><br>

        <label>Progress:</label><br>
        <input type="text" id="progress"><br><br>

        <label>Due Date:</label><br>
        <input type="date" id="due_date"><br><br>

        <input type="submit" value="Add Assignment">
    </form>

    <h2>Your Assignments</h2>

    <ul id="assignmentList"></ul>

    <script src="scripts/assignment.js"></script>

</body>
</html>
